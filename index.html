function getCloudDisplayName(user = cloudUser) {
  if (!user) return '';

  const meta = user.user_metadata || {};
  const name = (
    meta.full_name ||
    meta.name ||
    meta.display_name ||
    ''
  ).trim();

  if (name) return name;

  const email = (user.email || '').trim();
  return email.includes('@')
    ? email.split('@')[0]
    : 'User ' + String(user.id || '').slice(0, 6);
}

function courseHistory(q=''){
 const query=q.trim().toLowerCase();
 const matches=[...state.topics]
  .filter(t=>!query||String(t.name||'').toLowerCase().includes(query)||courseName(t.courseId).toLowerCase().includes(query))
  .sort((a,b)=>b.date.localeCompare(a.date)||(a.sortOrder||0)-(b.sortOrder||0));
 if(!matches.length)return empty('No topic history','Topics will appear here when you plan them.');
 const groups=new Map();
 matches.forEach(t=>{const key=t.courseId||'uncategorized';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t)});
 const courseOrder=new Map(state.courses.map((c,i)=>[c.id,i]));
 const ordered=[...groups.entries()].sort((a,b)=>{
  const ai=courseOrder.has(a[0])?courseOrder.get(a[0]):9999,bi=courseOrder.has(b[0])?courseOrder.get(b[0]):9999;
  return ai-bi||courseName(a[0]).localeCompare(courseName(b[0]));
 });
 return `<div class="history-groups">${ordered.map(([courseId,topics])=>{
  const done=topics.filter(isDone).length,planned=topics.length,est=topics.reduce((n,t)=>n+(+t.estimate||0),0),name=courseName(courseId);
  return `<details class="history-group" open><summary class="history-summary"><span class="history-chevron">⌄</span><span class="history-course"><strong>${esc(name)}</strong><small>${planned} topic${planned===1?'':'s'} · ${done} completed · ${planned-done} remaining</small></span><span class="history-summary-right"><span class="tag ${done===planned?'done':''}">${pct(done,planned)}%</span><span class="history-estimate">${est?minutesLabel(est):'—'}</span></span></summary><div class="history-progress">${progress(done,planned)}</div><div class="history-topics">${topics.map(t=>`<div class="history-topic"><span class="history-topic-bullet ${isDone(t)?'complete':''}">${isDone(t)?'✓':'·'}</span><div class="itembody"><div class="itemtitle">${esc(t.name)}</div><div class="meta">${fmtDate(t.date,{month:'short',day:'numeric',year:'numeric'})} · ${t.estimate?minutesLabel(t.estimate):'No estimate'}${t.deadline?' · Deadline: '+esc(deadlineState(t.deadline).label):''}</div></div><span class="tag ${isDone(t)?'done':''}">${esc(t.status||'Not Started')}</span></div>`).join('')}</div></details>`;
 }).join('')}</div>`;
}

function clockFmt(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function renderWeekly(){let ws=weekStats(weekDate),days=rangeDates(ws.start,ws.end),rev=state.reviews[ws.start]||{};return `${pageHead('Weekly Review','Monday–Sunday. Your review stays saved even when future plans change.',`<button class="primary" data-action="save-review">Save review</button>`)}<div class="row" style="margin-bottom:15px;flex-wrap:wrap"><div><label>Choose a date in the week</label><input id="weekDate" type="date" value="${weekDate}" style="width:auto"></div><div class="tag">${fmtDate(ws.start)} – ${fmtDate(ws.end)}</div></div><div class="grid stats">${stat('TOPICS COMPLETED',`${ws.done}/${ws.planned}`,`${pct(ws.done,ws.planned)}% completion`,'accent')}${stat('ACTUAL STUDY',minutesLabel(ws.actual),'From saved sessions','green')}${stat('PLANNED STUDY',minutesLabel(ws.plannedMin),'Topic estimates only')}${stat('REMAINING TOPICS',ws.planned-ws.done,'From current planned dates')}</div><div class="grid twocol"><div class="card"><div class="sectionhead"><h2>Daily topic completion</h2><small>Current week</small></div><div class="daystrip">${days.map(d=>{let ts=topicsFor(d),dn=ts.filter(isDone).length;return `<div class="daybox"><small>${dateObj(d).toLocaleDateString(undefined,{weekday:'short'})}</small><b>${dn}/${ts.length}</b><div class="minibar"><span style="width:${pct(dn,ts.length)}%"></span></div><small>${minutesLabel(actualFor(d))}</small></div>`}).join('')}</div></div><div class="card"><div class="sectionhead"><h2>Course breakdown</h2></div>${state.courses.map(c=>{let ts=ws.items.filter(t=>t.courseId===c.id),dn=ts.filter(isDone).length;return ts.length?`<div style="margin:13px 0"><div class="barlabel"><span>${esc(c.name)}</span><span>${dn}/${ts.length}</span></div>${progress(dn,ts.length)}</div>`:''}).join('')||empty('No topics this week','Plan topics to see course-level progress.')}</div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Weekly reflection</h2><span class="tag">Saved for week starting ${fmtDate(ws.start,{month:'short',day:'numeric'})}</span></div><div class="fieldgrid">${[['accomplished','What did I accomplish?'],['learned','What did I learn?'],['completedTopics','Which topics did I complete?'],['blocked','What blocked my progress?'],['distractions','What distracted me?'],['change','What should I change next week?'],['outcomes',"Next week's three most important outcomes"]].map(([k,l])=>`<div class="${k==='outcomes'?'full':''}"><label>${l}</label><textarea rows="2" data-review="${k}" placeholder="Write a quick note…">${esc(rev[k]||'')}</textarea></div>`).join('')}</div><div class="footerhint">Planned hours are estimates; actual hours come only from saved study sessions.</div></div>`}
function renderMonthly(){let ms=monthStats(month),milestones=state.milestones.filter(m=>m.month===month);return `${pageHead('Monthly Goals','Track topic execution and milestone outcomes separately.',`<button class="primary" data-action="add-milestone">＋ Milestone</button>`)}<div style="margin-bottom:15px"><label>Month</label><input id="monthInput" type="month" value="${month}" style="width:auto"></div><div class="grid stats">${stat('TOPICS PLANNED',ms.planned,'Current planned dates')}${stat('TOPICS COMPLETED',ms.done,`${pct(ms.done,ms.planned)}% completion`,'green')}${stat('REMAINING TOPICS',ms.planned-ms.done,'Not completed yet')}${stat('PLANNED STUDY',minutesLabel(ms.plannedMin),'Estimates only')}</div><div class="grid twocol"><div class="card"><div class="sectionhead"><h2>Course progress</h2><small>${month}</small></div>${state.courses.map(c=>{let ts=ms.items.filter(t=>t.courseId===c.id),dn=ts.filter(isDone).length;return ts.length?`<div style="margin:14px 0"><div class="barlabel"><span>${esc(c.name)}</span><span>${dn}/${ts.length} · ${pct(dn,ts.length)}%</span></div>${progress(dn,ts.length)}</div>`:''}).join('')||empty('No topics this month','Your topic plan will populate this view.')}</div><div class="card"><div class="sectionhead"><h2>Milestones</h2><small>${milestones.filter(m=>m.done).length}/${milestones.length} done</small></div>${milestones.length?milestones.map(m=>`<div class="item"><input class="check" type="checkbox" data-milestone-check="${m.id}" ${m.done?'checked':''}><div class="itembody"><div class="itemtitle">${esc(m.title)}</div><div class="meta">Milestone · confirm completion separately from topic progress</div></div><button class="tinybtn" data-edit-milestone="${m.id}">Edit</button><button class="tinybtn danger" data-del-milestone="${m.id}">×</button></div>`).join(''):empty('No milestones for this month','Add a milestone you want to finish.')}</div></div><div class="card" style="margin-top:14px"><h2>Monthly topic trend by week</h2><div class="grid threecol" style="margin-top:12px">${[1,2,3,4,5].map(w=>{let first=`${month}-${String(1).padStart(2,'0')}`,start=addDays(first,(w-1)*7),end=addDays(start,6),ts=ms.items.filter(t=>t.date>=start&&t.date<=end);return `<div><div class="barlabel"><span>Week ${w}</span><span>${ts.filter(isDone).length}/${ts.length}</span></div>${progress(ts.filter(isDone).length,ts.length)}</div>`}).join('')}</div></div>`}
const careerList=['Resume updated','GitHub reviewed','LinkedIn reviewed','Core programming practised','DSA practice','SQL practice','DBMS revision','Operating systems revision','Computer networks revision','Projects documented','Mock interviews completed','Applications submitted'];function renderCareer(){return `${pageHead('Projects & Career','Build evidence of your skills and keep placement decisions grounded.',`<button class="primary" data-action="add-project">＋ Add project</button>`)}<div class="grid twocol"><div class="card"><div class="sectionhead"><h2>Projects</h2><small>${state.projects.length} projects</small></div>${state.projects.length?state.projects.map(p=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(p.name)}</div><div class="meta">${esc(p.status||'Planning')} · ${esc(p.stack||'Stack not set')} ${p.next?'· Next: '+esc(p.next):''}</div>${p.repo?`<a href="${esc(p.repo)}" target="_blank" rel="noreferrer" style="color:var(--accent2);font-size:11px">Repository ↗</a>`:''}</div><button class="tinybtn" data-edit-project="${p.id}">Edit</button><button class="tinybtn danger" data-del-project="${p.id}">×</button></div>`).join(''):empty('No projects yet','Add a project and define the next concrete action.')}</div><div class="card"><div class="sectionhead"><h2>Career readiness</h2><small>${Object.values(state.careerChecks).filter(Boolean).length}/${careerList.length}</small></div>${careerList.map((x,i)=>`<div class="item"><input class="check" type="checkbox" data-career="${i}" ${state.careerChecks[i]?'checked':''}><div class="itembody"><div class="itemtitle">${x}</div></div></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Placement decision log</h2><button class="primary" data-action="add-decision">＋ Add decision</button></div><p class="sub">Record the service fee, eligibility, deadlines, recruiter access, opportunities, compensation/equity terms, risks, evidence, and your decision. This app does not verify or invent placement claims.</p>${state.decisions?.length?state.decisions.map(d=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(d.name)}</div><div class="meta">${esc(d.decision||'Not decided')} · Review ${esc(d.review||'not set')} · ${esc(d.fee||'Fee not recorded')}</div><div class="meta">${esc(d.evidence||'No evidence recorded')}</div></div><button class="tinybtn" data-edit-decision="${d.id}">Edit</button><button class="tinybtn danger" data-del-decision="${d.id}">×</button></div>`).join(''):empty('No placement decisions recorded','Keep facts, risks, and evidence together before committing.')}</div>`}
function renderJournal(){return `${pageHead('Reflection Journal','Short notes are enough. Keep track of lessons, energy, and tomorrow’s first action.',`<button class="primary" data-action="add-journal">＋ New entry</button>`)}<div class="card"><div class="sectionhead"><h2>Journal entries</h2><input id="journalSearch" placeholder="Search entries…" style="max-width:240px"></div><div id="journalEntries">${journalEntries()}</div></div>`}function journalEntries(q=''){let entries=[...state.journal].sort((a,b)=>b.date.localeCompare(a.date));entries=entries.filter(e=>!q||[e.accomplishments,e.lessons,e.distractions,e.tomorrow].join(' ').toLowerCase().includes(q.toLowerCase()));return entries.length?entries.map(e=>`<div class="item"><div class="itembody"><div class="itemtitle">${fmtDate(e.date)} · ${esc(e.accomplishments||'Daily reflection')}</div><div class="meta">Energy ${e.energy||'—'}/5 · Focus ${e.focus||'—'}/5 · ${esc(e.tomorrow||'No first action set')}</div><div class="meta">${esc(e.lessons||'')}</div></div><button class="tinybtn" data-edit-journal="${e.id}">Edit</button><button class="tinybtn danger" data-del-journal="${e.id}">×</button></div>`).join(''):empty('No journal entries','Add a quick reflection after your day.')}
function renderSettings(){return `${pageHead('Settings & Data',cloudUser?'Cloud sync is active for your account; a local backup is also kept.':(cloudConfigured?'Sign in to sync this workspace across devices.':'Configure Supabase to enable cloud accounts and sync.'),`<button class="primary" data-action="backup">Export backup</button>`)}<div class="grid twocol"><div class="card"><h2>Cloud database &amp; account</h2><p class="sub" style="margin:6px 0 12px">${cloudConfigured? (cloudUser?`Signed in as ${esc(getCloudDisplayName()||cloudUser.id)}. Changes sync to your private cloud workspace.`:`Supabase is configured. Sign in or create an account to enable sync.`):`Cloud is not configured yet. Add your Supabase project URL and publishable/anon key to config.js, then run the SQL setup file.`}</p><div class="row" style="flex-wrap:wrap"><button class="primary" data-action="cloud-auth">${cloudUser?'Manage account':'Sign in / Create account'}</button>${cloudUser?`<button data-action="cloud-upload-local">Replace cloud data with this browser's data</button><button data-action="cloud-logout">Sign out</button>`:''}</div><div class="footerhint">Each account gets a private workspace protected by Supabase Row Level Security. Never put a service-role key in this app.</div></div><div class="card"><h2>Email notifications (Gmail)</h2><p class="sub" style="margin:6px 0 12px">Receive deadline alerts and a daily YOS summary. Email delivery runs through a secure Google Apps Script worker, so it can continue when this page is closed. Sign in to your Supabase account and configure the worker using the included setup guide.</p><label>Email recipient</label><input id="emailRecipient" type="email" autocomplete="email" placeholder="you@gmail.com" value="${esc(state.settings.emailRecipient||'')}" style="width:100%;margin:6px 0 12px"><label class="row" style="color:var(--text);gap:9px;margin:8px 0"><input id="emailAlertsEnabled" type="checkbox" style="width:auto" ${state.settings.emailAlertsEnabled?'checked':''}> Enable instant deadline alert emails</label><label class="row" style="color:var(--text);gap:9px;margin:8px 0"><input id="emailDailySummaryEnabled" type="checkbox" style="width:auto" ${state.settings.emailDailySummaryEnabled?'checked':''}> Send daily summary near 11:50 PM</label><div class="footerhint">The daily trigger is scheduled near 11:50 PM in the Google Apps Script project timezone; Google may run it within an approximate 15-minute window. Instant alerts are checked every 5 minutes. Gmail credentials and the Supabase service-role key stay in Google Apps Script properties, never in this HTML.</div><button class="primary" style="margin-top:12px" data-action="save-email-settings">Save email settings</button></div><div class="card"><h2>Appearance</h2><p class="sub" style="margin:6px 0 12px">Choose the interface theme for this browser.</p><select id="themeSelect"><option value="dark" ${state.settings.theme!=='light'?'selected':''}>Dark</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option></select><button class="primary" style="margin-top:10px" data-action="save-theme">Save appearance</button></div><div class="card"><h2>Deadline & pace</h2><p class="sub" style="margin:6px 0 15px">Overall learning deadline used for the countdown.</p><label>Target deadline</label><input id="deadlineInput" type="date" value="${state.settings.deadline}"><div style="margin-top:15px" class="row between"><div><div class="statvalue" style="font-size:22px">${minutesLabel(state.courses.reduce((n,c)=>n+Math.max(0,c.total-c.completed),0))}</div><div class="meta">Lecture time remaining</div></div><div><div class="statvalue" style="font-size:22px">${(state.courses.reduce((n,c)=>n+Math.max(0,c.total-c.completed),0)/60/Math.max(1,Math.ceil((dateObj(state.settings.deadline)-dateObj(today()))/86400000))).toFixed(1)}h</div><div class="meta">Required average/day</div></div></div><div class="pace-note">Actual study pace: ${(state.sessions.length? (state.sessions.reduce((n,s)=>n+(+s.minutes||0),0)/Math.max(1,(dateObj(today())-dateObj(state.sessions.reduce((min,s)=>s.date<min?s.date:min,today())))/86400000)/60).toFixed(2):'0.00')} h/day recorded across the current session history. Required pace is based on remaining configured lecture time, not topic estimates.</div></div><div class="card"><h2>Minimum Viable Day</h2><p class="sub" style="margin:6px 0 15px">A reduced plan is not the same as completing your normal target.</p><label class="row" style="color:var(--text);gap:9px"><input id="minimumToggle" type="checkbox" style="width:auto" ${state.settings.minimumDay?'checked':''}> Enable reduced-day plan</label><div class="fieldgrid" style="margin-top:13px"><div><label>Coding minutes</label><input id="minimumCoding" type="number" min="0" value="${state.settings.minimumCoding}"></div><div><label>Revision minutes</label><input id="minimumRevision" type="number" min="0" value="${state.settings.minimumRevision}"></div></div><button class="primary" style="margin-top:12px" data-action="save-settings">Save settings</button></div></div><div class="card" style="margin-top:14px"><h2>Export & restore</h2><p class="sub" style="margin:6px 0 15px">Export CSV files for topics, tasks, and study sessions, or download a full JSON backup. Restoring replaces data currently saved in this browser.</p><div class="row" style="flex-wrap:wrap"><button data-action="export-topics">Topics CSV</button><button data-action="export-tasks">Tasks CSV</button><button data-action="export-academic">Academic CSV</button><button data-action="export-sessions">Sessions CSV</button><button data-action="backup">Full JSON backup</button><button data-action="restore">Restore JSON backup</button><input id="restoreFile" type="file" accept="application/json,.json" class="hidden"></div><div class="footerhint">Local mode stores data in this browser. When signed in, SOS also syncs the workspace to Supabase. Keep backups; cloud sync requires correct project configuration and database policies.</div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Danger zone</h2><span class="tag overdue">Destructive</span></div><button class="danger" data-action="reset">Reset all SOS data</button></div>`}
function render(){ $('#topDate').textContent=fmtDate(today(),{weekday:'short',month:'short',day:'numeric'});let fn={home:renderHome,topics:renderTopics,tasks:renderTasks,courses:renderCourses,academic:renderAcademic,sessions:renderSessions,weekly:renderWeekly,monthly:renderMonthly,career:renderCareer,journal:renderJournal,settings:renderSettings}[page];$('#content').innerHTML=fn();bindDynamic()}
function openModal(title,body,submitText='Save',onSubmit=null){$('#modalRoot').innerHTML=`<div class="modalback" id="modalBack"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${title}</h2><button id="modalClose">✕</button></div><form id="modalForm">${body}<div class="actions"><button type="button" class="ghost" id="modalCancel">Cancel</button><button class="primary" type="submit">${submitText}</button></div></form></div></div>`;const close=()=>$('#modalRoot').innerHTML='';$('#modalClose').onclick=close;$('#modalCancel').onclick=close;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')close()};$('#modalForm').onsubmit=e=>{e.preventDefault();if(onSubmit?.(new FormData(e.target))!==false){close();save();render()}}}
function field(label,name,value='',type='text',extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value){return `<div><label>${label}</label><select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}function textArea(label,name,value='',rows=3){return `<div class="full"><label>${label}</label><textarea name="${name}" rows="${rows}">${esc(value)}</textarea></div>`}function deadlineControl(value=''){const enabled=!!value;let v=value||'';if(/^\\d{4}-\\d{2}-\\d{2}$/.test(v))v+='T23:59';if(v&&v.endsWith('Z')){const d=new Date(v);if(!isNaN(d))v=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}return `<div class="full deadline-control"><label class="deadline-toggle"><input type="checkbox" name="deadlineEnabled" value="yes" ${enabled?'checked':''} onchange="const f=this.closest('.deadline-control').querySelector('[name=deadlineAt]');f.disabled=!this.checked;if(!this.checked)f.value='' " style="width:auto"> End date &amp; time (deadline)</label><div style="margin-top:8px"><input name="deadlineAt" type="datetime-local" value="${esc(v)}" ${enabled?'':'disabled'}></div><div class="footerhint">Choose the deadline date and time together.</div></div>`}
function deadlineFromForm(fd){if(fd.get('deadlineEnabled')!=='yes')return '';return fd.get('deadlineAt')||''}
function scheduleStartControl(value='',mode='now'){let v=value||'';if(v&&v.endsWith('Z')){const d=new Date(v);if(!isNaN(d))v=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}return `<div class="full schedule-start ${mode==='later'?'':'hidden'}"><label>Start date &amp; time</label><input name="startDate" type="datetime-local" value="${esc(v)}" ${mode==='later'?'':'disabled'}></div>`}
function wireScheduleMode(){const sel=$('#modalForm [name=scheduleMode]');if(!sel)return;const sync=()=>{const later=sel.value==='later';const start=$('#modalForm .schedule-start');if(start){start.classList.toggle('hidden',!later);const input=start.querySelector('[name=startDate]');input.disabled=!later;if(!later)input.value=''}};sel.addEventListener('change',sync);sync()}
function addTopicModal(t=null){let edit=!!t;openModal(edit?'Edit topic':'Add topic',`<div class="fieldgrid">${field('Topic name *','name',t?.name||'')}${selectField('Course *','courseId',state.courses.map(c=>[c.id,c.name]),t?.courseId||state.courses[0]?.id)}${selectField('Schedule','scheduleMode',[['now','Now'],['later','Later']],t?.scheduleMode||'now')}${field('Planned date *','date',t?.date||topicDate,'date')}${field('Estimated minutes','estimate',t?.estimate||'','number','min="0" max="1440"')}${scheduleStartControl(t?.startDate||'',t?.scheduleMode||'now')}${selectField('Status','status',['Not Started','In Progress','Completed'].map(x=>[x,x]),t?.status||'Not Started')}${deadlineControl(t?.deadline||'')}</div>`,edit?'Save changes':'Add topic',fd=>{let name=fd.get('name').trim();if(!name){toast('Topic name is required');return false}const deadline=deadlineFromForm(fd);if(fd.get('deadlineEnabled')==='yes'&&!deadline){toast('Choose both a deadline date and time, or untick the deadline option');return false}const mode=fd.get('scheduleMode')||'now';let startValue=fd.get('startDate');if(mode==='now')startValue=new Date().toISOString();else if(!startValue){toast('Choose a start date and time for a Later topic');return false}let data={name,courseId:fd.get('courseId'),date:fd.get('date'),estimate:Math.max(0,+fd.get('estimate')||0),status:fd.get('status'),deadline,startDate:startValue?new Date(startValue).toISOString():'',scheduleMode:mode};if(!data.date||!course(data.courseId)){toast('Choose a valid date and course');return false}if(edit)Object.assign(t,data,{updatedAt:new Date().toISOString()});else state.topics.push({id:id(),...data,sortOrder:state.topics.filter(x=>x.date===data.date&&x.courseId===data.courseId).length,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});topicDate=data.date;toast(edit?'Topic updated':'Topic added')});wireScheduleMode()}
function bulkTopicModal(){openModal('Bulk add topics',`<div class="fieldgrid">${selectField('Course *','courseId',state.courses.map(c=>[c.id,c.name]),state.courses[0]?.id)}${field('Planned date *','date',topicDate,'date')}<div class="full"><label>Topic names · one per line *</label><textarea name="names" rows="9" placeholder="Variables and data types&#10;Conditional statements&#10;Loops&#10;Functions" required></textarea></div>${field('Estimated minutes per topic (optional)','estimate','','number','min="0" max="1440"')}</div>`, 'Create topics',fd=>{let names=fd.get('names').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!names.length||!fd.get('date')||!course(fd.get('courseId'))){toast('Add topic names, course, and date');return false}let est=Math.max(0,+fd.get('estimate')||0),now=new Date().toISOString();let order=state.topics.filter(t=>t.date===fd.get('date')&&t.courseId===fd.get('courseId')).length;names.forEach((name,i)=>state.topics.push({id:id(),name,courseId:fd.get('courseId'),date:fd.get('date'),estimate:est,status:'Not Started',sortOrder:order+i,createdAt:now,updatedAt:now}));topicDate=fd.get('date');toast(`${names.length} topics added`)})}
function addTaskModal(t=null){let edit=!!t;openModal(edit?'Edit task':'Add task',`<div class="fieldgrid">${field('Title *','title',t?.title||'')}${selectField('Schedule','scheduleMode',[['now','Now'],['later','Later']],t?.scheduleMode||'now')}${field('Scheduled date *','date',t?.date||today(),'date')}${selectField('Category','category',['Learning','Academic','Coding Practice','Revision','Projects','Career','Health','Personal'].map(x=>[x,x]),t?.category||'Learning')}${selectField('Priority','priority',['Low','Medium','High'].map(x=>[x,x]),t?.priority||'Medium')}${selectField('Status','status',['Pending','In Progress','Completed','Cancelled'].map(x=>[x,x]),t?.status||'Pending')}${field('Estimated minutes','estimate',t?.estimate||'','number','min="0"')}${scheduleStartControl(t?.startDate||'',t?.scheduleMode||'now')}${deadlineControl(t?.deadline||'')}${textArea('Description / notes','notes',t?.notes||'',2)}</div>`,edit?'Save changes':'Create task',fd=>{let title=fd.get('title').trim();if(!title){toast('Task title is required');return false}const deadline=deadlineFromForm(fd);if(fd.get('deadlineEnabled')==='yes'&&!deadline){toast('Choose both a deadline date and time, or untick the deadline option');return false}const nowIso=new Date().toISOString(),mode=fd.get('scheduleMode')||'now';let startValue=fd.get('startDate');if(mode==='now')startValue=nowIso;else if(!startValue){toast('Choose a start date and time for a Later task');return false}let d={title,date:fd.get('date'),category:fd.get('category'),priority:fd.get('priority'),status:fd.get('status'),estimate:Math.max(0,+fd.get('estimate')||0),deadline,notes:fd.get('notes'),startDate:startValue?new Date(startValue).toISOString():'',scheduleMode:mode};if(edit)Object.assign(t,d,{createdAt:t.createdAt||nowIso,updatedAt:nowIso});else state.tasks.push({id:id(),...d,createdAt:nowIso});taskDate=d.date;toast(edit?'Task updated':'Task added')});wireScheduleMode()}
function addCourseModal(c=null){let edit=!!c;let currentDeadline=c?.deadline||'';if(/^\d{4}-\d{2}-\d{2}$/.test(currentDeadline))currentDeadline+='T23:59';openModal(edit?'Edit course':'Add course',`<div class="fieldgrid">${field('Course name *','name',c?.name||'')}${field('Start date','startDate',(c?c.startDate||'':today()),'date')}${deadlineControl(currentDeadline)}</div><p class="footerhint">Course progress is calculated automatically from completed topics in this course. Actual time is calculated from saved study sessions.</p>`,edit?'Save course':'Create course',fd=>{let name=fd.get('name').trim();if(!name){toast('Enter a course name');return false}let total=+c?.total||0,completed=+c?.completed||0;let startDate=fd.get('startDate')||'',deadline=deadlineFromForm(fd);if(fd.get('deadlineEnabled')==='yes'&&!deadline){toast('Choose both a deadline date and time, or untick the deadline option');return false}if(startDate&&deadline&&deadline.slice(0,10)<startDate){toast('Deadline cannot be before the start date');return false}let d={name,total:Math.round(total),completed:Math.max(0,Math.round(completed)),startDate,deadline};if(edit)Object.assign(c,d);else state.courses.push({id:id(),...d,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});toast(edit?'Course updated':'Course added')})}

st('Settings saved');break;case'save-review':$$('[data-review]').forEach(x=>{let key=monday(weekDate);state.reviews[key]=state.reviews[key]||{};state.reviews[key][x.dataset.review]=x.value});save();toast('Weekly review saved');break;case'timer-start':if(!timerRemaining){timerRemaining=25*60;timerInitial=timerRemaining;timerEverStarted=false}if(!timerRunning){timerEverStarted=true;timerRunning=true;timerEnd=Date.now()+timerRemaining*1000;saveTimer();clearInterval(timerInterval);timerInterval=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));saveTimer();if($('#clock'))$('#clock').textContent=clockFmt(timerRemaining);if(timerRemaining<=0){timerRunning=false;clearInterval(timerInterval);saveTimer();if($('#timerState'))$('#timerState').textContent='Timer finished. Save a session if you studied.';toast('Focus timer finished');notifyTimerFinished()}} ,250);if($('#timerState'))$('#timerState').textContent='Focus session in progress';}break;case'timer-pause':if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerInterval);saveTimer();if($('#timerState'))$('#timerState').textContent='Paused';if($('#clock'))$('#clock').textContent=clockFmt(timerRemaining)}break;case'timer-stop':{if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerInterval);saveTimer()}let elapsed=Math.floor((timerInitial-timerRemaining)/60);if(timerEverStarted&&elapsed>0){if(confirm(`Log approximately ${elapsed} minutes as actual study time?`)){addSessionModal(null,$('#timerCourse')?.value||state.courses[0]?.id);setTimeout(()=>{let mi=$('#modalForm input[name="minutes"]');if(mi)mi.value=elapsed},0)}}timerRemaining=0;timerEverStarted=false;saveTimer();if($('#clock'))$('#clock').textContent='00:00';if($('#timerState'))$('#timerState').textContent='Timer stopped';break}case'stopwatch-start':if(!stopwatchRunning){stopwatchRunning=true;stopwatchStart=Da
