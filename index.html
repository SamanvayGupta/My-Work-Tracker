ter;gap:10px;padding:10px 0;border-bottom:1px solid #282a34}.item:last-child{border-bottom:0}.itembody{min-width:0;flex:1}.itemtitle{font-weight:600;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:11px;margin-top:2px}.check{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}.tag{font-size:10px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;color:var(--muted);white-space:nowrap}.tag.done{color:var(--green);border-color:#32614f}.tag.overdue{color:var(--red);border-color:#60383e}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters>*{max-width:210px}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fieldgrid .full{grid-column:1/-1}.empty{border:1px dashed #393c49;border-radius:12px;padding:24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:4px}.course-row{display:grid;grid-template-columns:minmax(110px,1fr) 2fr auto;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #282a34}.course-row:last-child{border:0}.course-name{font-weight:650}.course-meta{font-size:11px;color:var(--muted)}.barlabel{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.daybox{background:#12141a;border:1px solid var(--line);border-radius:10px;padding:10px 5px;text-align:center}.daybox b{display:block;font-size:17px}.daybox small{color:var(--muted);font-size:10px}.daybox .minibar{height:3px;background:#2b2d37;margin-top:8px;border-radius:10px;overflow:hidden}.daybox .minibar span{display:block;height:100%;background:var(--accent)}.timer{text-align:center;padding:20px 0}.clock{font-size:54px;font-weight:750;letter-spacing:-2px;margin:12px}.muted{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#242632;border:1px solid #45485a;padding:12px 16px;border-radius:12px;box-shadow:0 8px 35px #0008;z-index:10;max-width:330px}.mobilemenu{display:none}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.tinybtn{padding:5px 8px;font-size:11px}.footerhint{font-size:11px;color:var(--muted);margin-top:12px}.itemtools{display:flex;gap:5px;align-items:center}.itemtools button{white-space:nowrap}[data-move-topic]{padding:4px 7px;font-size:11px}.pace-note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px;color:var(--muted)}body.light{--bg:#f4f5f8;--panel:#fff;--panel2:#f0f1f6;--line:#dfe1e9;--text:#20212a;--muted:#656a7a;--accent:#7462d8;--accent2:#5946c4;--green:#167b54;--yellow:#8b6100;--red:#b83245}body.light .sidebar{background:#fff}body.light input,body.light select,body.light textarea{background:#fff;color:var(--text)}body.light .daybox,body.light .item{background:transparent}body.light .navbtn.active{background:#eeebff}body.light .toast{background:#fff;color:var(--text)}
@media(max-width:1000px){.app{grid-template-columns:190px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;width:250px;transform:translateX(-105%);transition:transform .2s;box-shadow:15px 0 40px #0007}.sidebar.open{transform:translateX(0)}.mobilemenu{display:inline-block}.topbar{height:62px;padding:0 14px}.content{padding:20px 13px 35px}.pagehead{display:block}.headtools{margin-top:15px;flex-wrap:wrap}.stats{gap:9px}.card{padding:14px}.statvalue{font-size:24px}.threecol{grid-template-columns:1fr}.course-row{grid-template-columns:1fr auto;gap:7px}.course-row .course-progress{grid-column:1/-1;grid-row:2}.fieldgrid{grid-template-columns:1fr}.fieldgrid .full{grid-column:auto}.clock{font-size:44px}.local-pill{display:none}h1{font-size:24px}}

<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">SOS</div><div><strong>Samanvay OS</strong><small>Personal command centre</small></div></div><div class="navgroup"><div class="navlabel">Workspace</div><button class="navbtn active" data-page="home"><span class="ico">◈</span>Command Center</button><button class="navbtn" data-page="topics"><span class="ico">☑</span>Topic Planner</button><button class="navbtn" data-page="tasks"><span class="ico">▤</span>Daily Planner</button><button class="navbtn" data-page="courses"><span class="ico">▥</span>Course Tracker</button><button class="navbtn" data-page="sessions"><span class="ico">◷</span>Study Sessions</button></div><div class="navgroup"><div class="navlabel">Review</div><button class="navbtn" data-page="weekly"><span class="ico">▦</span>Weekly Reviews</button><button class="navbtn" data-page="monthly"><span class="ico">◫</span>Monthly Goals</button></div><div class="navgroup"><div class="navlabel">Growth</div><button class="navbtn" data-page="career"><span class="ico">↗</span>Projects & Career</button><button class="navbtn" data-page="journal"><span class="ico">✎</span>Reflection Journal</button><button class="navbtn" data-page="settings"><span class="ico">⚙</span>Settings & Data</button></div><div class="sidefoot">Storage: <span id="storageModeLabel">Local mode</span><br><span id="storageStatus">Your data stays on this device.</span></div></aside><main class="main"><header class="topbar"><div class="row"><button class="mobilemenu" id="menuBtn">☰</button><div><div class="crumb">SOS / <span id="crumb">Command Center</span></div><div style="font-weight:650" id="topDate"></div></div></div><div class="topactions"><span class="local-pill" id="cloudModePill">● LOCAL MODE</span><button id="cloudAuthButton" data-action="cloud-auth">Connect account</button><button class="primary" id="quickTopic">＋ Topic</button></div></header><div class="content" id="content"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];const today=()=>localDate(new Date());function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}function dateObj(s){return new Date(s+'T12:00:00')}function fmtDate(s,opts={month:'short',day:'numeric',year:'numeric'}){if(!s)return '—';return dateObj(s).toLocaleDateString(undefined,opts)}function monday(s){let d=dateObj(s),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return localDate(d)}function minutesLabel(m){m=Math.max(0,Math.round(Number(m)||0));return `${Math.floor(m/60)}h ${m%60}m`}function pct(a,b){return b?Math.round(a/b*100):0}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2800)}
const initialCourses=[['Python',60*60+26],['Generative AI',32*60+34],['Data Science',42*60+3],['Machine Learning',30*60+43],['Deep Learning',16*60],['Natural Language Processing (NLP)',28*60]];
const defaultState=()=>({courses:initialCourses.map(([name,total])=>({id:id(),name,total,completed:0,deadline:'2026-12-31'})),topics:[],tasks:[],sessions:[],reviews:{},milestones:[{id:id(),month:'2026-10',title:'Establish daily learning routine',done:false},{id:id(),month:'2026-10',title:'Make progress in Python and practise fundamentals',done:false},{id:id(),month:'2026-10',title:'Plan topics for each study day',done:false},{id:id(),month:'2026-10',title:'Verify placement-service fees, eligibility, deadlines, and OJT restrictions',done:false},{id:id(),month:'2026-11',title:'Finish Python and Generative AI',done:false},{id:id(),month:'2026-11',title:'Build a Python or data-analysis project',done:false},{id:id(),month:'2026-12',title:'Update CV and GitHub; practise interviews',done:false}],projects:[],journal:[],careerChecks:{},settings:{deadline:'2026-12-31',minimumDay:false,minimumCoding:30,minimumRevision:20,theme:'dark'},timer:null,decisions:[]});
let state;try{state=JSON.parse(localStorage.getItem('sos-state-v1'))||defaultState()}catch(e){state=defaultState()}state={...defaultState(),...state,settings:{...defaultState().settings,...(state.settings||{})},decisions:state.decisions||[],reviews:state.reviews||{},careerChecks:state.careerChecks||{}};
let supabaseClient=null,cloudUser=null,cloudSaveTimer=null,cloudBusy=false,cloudConfigured=false;const cloudConfig=window.SOS_SUPABASE_CONFIG||{};cloudConfigured=!!(cloudConfig.url&&cloudConfig.anonKey&&!cloudConfig.url.includes('YOUR_PROJECT')&&!cloudConfig.anonKey.includes('YOUR_SUPABASE'));if(cloudConfigured&&window.supabase?.createClient){supabaseClient=window.supabase.createClient(cloudConfig.url,cloudConfig.anonKey);}
function updateCloudUI(){const pill=$('#cloudModePill'),btn=$('#cloudAuthButton'),mode=$('#storageModeLabel');if(pill)pill.textContent=cloudUser?'● CLOUD SYNC':'● LOCAL MODE';if(btn)btn.textContent=cloudUser?'Account: '+(cloudUser.email||'Signed in'):'Connect account';if(mode)mode.textContent=cloudUser?'Cloud + local backup':'Local mode';}
function queueCloudSave(){if(!cloudUser||!supabaseClient||cloudBusy)return;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(async()=>{try{const payload=JSON.parse(JSON.stringify(state));const {error}=await supabaseClient.from('sos_workspaces').upsert({user_id:cloudUser.id,data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;const el=$('#storageStatus');if(el)el.textContent='Cloud synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(err){const el=$('#storageStatus');if(el)el.textContent='Cloud sync failed — local copy kept';console.error('SOS cloud sync:',err);toast('Cloud sync failed. Your local copy is still saved. Check Settings & Data.')}},650);}
function save(){try{localStorage.setItem('sos-state-v1',JSON.stringify(state));const el=$('#storageStatus');if(el)el.textContent='Saved locally '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}catch(e){const el=$('#storageStatus');if(el)el.textContent='Save failed — export a backup';toast('Could not save. Storage may be full or disabled.')}queueCloudSave();}function course(idv){return state.courses.find(c=>c.id===idv)}function courseName(idv){return course(idv)?.name||'Unknown course'}function topicsFor(date){return state.topics.filter(t=>t.date===date)}function isDone(t){return t.status==='Completed'}function todayTopics(){return topicsFor(today())}function actualFor(date){return state.sessions.filter(s=>s.date===date).reduce((n,s)=>n+(+s.minutes||0),0)}function rangeDates(start,end){let out=[];for(let d=start;d<=end;d=addDays(d,1))out.push(d);return out}function weekStats(date){const start=monday(date),end=addDays(start,6),items=state.topics.filter(t=>t.date>=start&&t.date<=end);return {start,end,items,done:items.filter(isDone).length,planned:items.length,actual:state.sessions.filter(s=>s.date>=start&&s.date<=end).reduce((n,s)=>n+(+s.minutes||0),0),plannedMin:items.reduce((n,t)=>n+(+t.estimate||0),0)}}function monthStats(month){const items=state.topics.filter(t=>t.date?.slice(0,7)===month);return {items,done:items.filter(isDone).length,planned:items.length,actual:state.sessions.filter(s=>s.date?.slice(0,7)===month).reduce((n,s)=>n+(+s.minutes||0),0),plannedMin:items.reduce((n,t)=>n+(+t.estimate||0),0)}}function courseStats(c){const items=state.topics.filter(t=>t.courseId===c.id);return {items,done:items.filter(isDone).length,planned:items.length,remaining:Math.max(0,c.total-c.completed)}}
let page='home',topicDate=today(),topicFilter='All',topicCourse='all',taskDate=today(),taskFilter='All',weekDate=today(),month= today().slice(0,7),timerInterval=null,timerEnd=0,timerRemaining=0,timerRunning=false;
const pageNames={home:'Command Center',topics:'Topic Planner',tasks:'Daily Planner',courses:'Course Tracker',sessions:'Study Sessions',weekly:'Weekly Reviews',monthly:'Monthly Goals',career:'Projects & Career',journal:'Reflection Journal',settings:'Settings & Data'};
function go(p){page=p;$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=pageNames[p];$('#sidebar').classList.remove('open');render()}
function pageHead(title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${pageNames[page]}</div><h1>${title}</h1><p class="sub">${desc}</p></div><div class="headtools">${actions}</div></div>`}function stat(label,value,note,cls=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue ${cls}">${value}</div><div class="statnote">${note}</div></div>`}function progress(done,total,cls=''){return `<div class="progress ${cls}"><span style="width:${pct(done,total)}%"></span></div>`}function empty(title,desc){return `<div class="empty"><strong>${title}</strong>${desc}</div>`}function courseOptions(selected=''){return state.courses.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function topicItem(t){let overdue=t.date<today()&&!isDone(t);return `<div class="item"><input class="check" type="checkbox" aria-label="Complete topic" data-topic-check="${t.id}" ${isDone(t)?'checked':''}><div class="itembody"><div class="itemtitle" style="${isDone(t)?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.name)}</div><div class="meta">${esc(courseName(t.courseId))} · ${t.estimate?minutesLabel(t.estimate):'No estimate'} · ${fmtDate(t.date,{month:'short',day:'numeric'})}</div></div>${overdue?'<span class="tag overdue">Overdue</span>':''}<span class="tag ${isDone(t)?'done':''}">${t.status}</span><span class="itemtools"><button data-move-topic="${t.id}" data-dir="up" title="Move topic up">↑</button><button data-move-topic="${t.id}" data-dir="down" title="Move topic down">↓</button><button class="tinybtn" data-edit-topic="${t.id}" title="Edit topic">Edit</button><button class="tinybtn danger" data-del-topic="${t.id}" title="Delete topic">×</button></span></div>`}
function taskItem(t){return `<div class="item"><input class="check" type="checkbox" data-task-check="${t.id}" ${t.status==='Completed'?'checked':''}><div class="itembody"><div class="itemtitle">${esc(t.title)}</div><div class="meta">${esc(t.category)} · ${esc(t.priority)} priority${t.estimate?' · '+minutesLabel(t.estimate):''}</div></div>${t.date<today()&&t.status!=='Completed'?'<span class="tag overdue">Overdue</span>':''}<span class="tag">${t.status}</span><button class="tinybtn" data-duplicate-task="${t.id}">Copy</button><button class="tinybtn" data-edit-task="${t.id}">Edit</button><button class="tinybtn danger" data-del-task="${t.id}">×</button></div>`}
function renderHome(){const ts=todayTopics(),done=ts.filter(isDone).length,tasks=state.tasks.filter(t=>t.date===today()),td=tasks.filter(t=>t.status==='Completed').length,mins=actualFor(today()),ws=weekStats(today()),ms=monthStats(today().slice(0,7)),remaining=state.courses.reduce((n,c)=>n+Math.max(0,c.total-c.completed),0),days=Math.max(1,Math.ceil((dateObj(state.settings.deadline)-dateObj(today()))/86400000)),hoursPerDay=remaining/60/days,topTasks=state.tasks.filter(t=>t.status!=='Completed'&&t.status!=='Cancelled').sort((a,b)=>({High:0,Medium:1,Low:2}[a.priority]-({High:0,Medium:1,Low:2}[b.priority]))).slice(0,3),recent=[...state.sessions].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,4);let deadlineStatus=hoursPerDay<=3?'On track':'Needs attention';return `${pageHead('Make today count.',fmtDate(today(),{weekday:'long',month:'long',day:'numeric',year:'numeric'}),`<button data-action="focus">◷ Focus session</button><button class="primary" data-action="add-task">＋ Task</button>`)}<div class="grid stats">${stat('TOPICS TODAY',`${done}/${ts.length}`,`${pct(done,ts.length)}% complete`,'accent')}${stat('TASKS TODAY',`${td}/${tasks.length}`,`${pct(td,tasks.length)}% complete`)}${stat('STUDY TIME',minutesLabel(mins),'Actual time logged','green')}${stat('DEADLINE COUNTDOWN',`${Math.max(0,Math.ceil((dateObj(state.settings.deadline)-dateObj(today()))/86400000))} days`,`${minutesLabel(remaining)} lecture time remaining`)}</div><div class="grid twocol"><div class="grid"><div class="card"><div class="sectionhead"><div><h2>Today's topics</h2><small>${ts.length} planned · ${done} completed</small></div><button class="tinybtn" data-go="topics">Open planner →</button></div>${progress(done,ts.length)}${ts.length?`<div class="list">${ts.slice(0,5).map(t=>`<div class="item"><input class="check" type="checkbox" data-topic-check="${t.id}" ${isDone(t)?'checked':''}><div class="itembody"><div class="itemtitle">${esc(t.name)}</div><div class="meta">${esc(courseName function renderTopics(){let items=state.topics.filter(t=>t.date===topicDate);if(topicCourse!=='all')items=items.filter(t=>t.courseId===topicCourse);if(topicFilter!=='All')items=items.filter(t=>t.status===topicFilter);const all=topicsFor(topicDate),done=all.filter(isDone).length,prog=all.filter(t=>t.status==='In Progress').length;return `${pageHead('Topic Planner','Plan once. Daily, weekly, monthly, and course progress updates from the same records.',`<button data-action="bulk-topic">＋ Bulk add</button><button class="primary" data-action="add-topic">＋ Add topic</button>`)}<div class="card"><div class="row between" style="flex-wrap:wrap;margin-bottom:17px"><div class="row"><div><label for="topicDate">Planning date</label><input id="topicDate" type="date" value="${topicDate}" style="width:auto"></div><div><label for="topicCourse">Course filter</label><select id="topicCourse"><option value="all">All courses</option>${courseOptions(topicCourse==='all'?'':topicCourse)}</select></div></div><div class="row"><div style="text-align:right"><div class="statvalue" style="font-size:23px;margin:0">${pct(done,all.length)}%</div><div class="meta">complete</div></div><div style="width:110px">${progress(done,all.length)}</div></div></div><div class="grid threecol" style="margin-bottom:16px">${stat('PLANNED',all.length,'Topics on selected date')}${stat('COMPLETED',done,'Marked complete','green')}${stat('IN PROGRESS',prog,`${all.length-done-prog} not started`)}</div><div class="filters"><select id="topicFilter"><option ${topicFilter==='All'?'selected':''}>All</option><option ${topicFilter==='Not Started'?'selected':''}>Not Started</option><option ${topicFilter==='In Progress'?'selected':''}>In Progress</option><option ${topicFilter==='Completed'?'selected':''}>Completed</option><option ${topicFilter==='Overdue'?'selected':''}>Overdue</option></select><button class="tinybtn" data-action="overdue">Show overdue</button><button class="tinybtn" data-action="export-topics">Export topics CSV</button></div>${items.length?`<div class="list">${items.map(topicItem).join('')}</div>`:empty('No topics match','Add topics or change the filters.')}</div><div class="grid twocol" style="margin-top:14px"><div class="card"><h2>Fast planning</h2><p class="sub" style="margin:7px 0 14px">Paste one topic per line and assign them in one go.</p><button class="primary" data-action="bulk-topic">Bulk add topics</button></div><div class="card"><h2>How progress works</h2><p class="sub" style="margin-top:8px">A topic's planned date determines its daily, weekly, and monthly grouping. Rescheduling updates the existing record. Estimated minutes are planned time, never actual study time.</p></div></div>`}
function renderTasks(){let items=state.tasks.filter(t=>(taskDate==='all'||t.date===taskDate)&&(taskFilter==='All'||t.status===taskFilter));let open=state.tasks.filter(t=>t.status!=='Completed'&&t.status!=='Cancelled');return `${pageHead('Daily Planner','Keep non-topic commitments in one simple list.',`<button class="primary" data-action="add-task">＋ Add task</button>`)}<div class="grid stats">${stat('SCHEDULED',state.tasks.filter(t=>t.date===taskDate).length,'Tasks on selected date')}${stat('OPEN TASKS',open.length,'Across all dates')}${stat('OVERDUE',open.filter(t=>t.date<today()).length,'Need a decision','red')}${stat('COMPLETED',state.tasks.filter(t=>t.status==='Completed').length,'All-time tasks','green')}</div><div class="card"><div class="filters"><input id="taskDate" type="date" value="${taskDate==='all'?'':taskDate}" style="width:auto"><select id="taskFilter"><option ${taskFilter==='All'?'selected':''}>All</option>${['Pending','In Progress','Completed','Cancelled'].map(x=>`<option ${taskFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="tinybtn" data-action="all-tasks">All dates</button><button class="tinybtn" data-action="carry">Carry unfinished forward</button></div>${items.length?`<div class="list">${items.map(taskItem).join('')}</div>`:empty('No tasks here','Add a task or change the date filter.')}</div>`}
function renderCourses(){return `${pageHead('Course Tracker','Track lecture time separately from topic mastery.',`<button class="primary" data-action="add-course">＋ Add course</button>`)}<div class="grid stats">${stat('COURSES',state.courses.length,'Active course records')}${stat('TOTAL WORKLOAD',minutesLabel(state.courses.reduce((n,c)=>n+c.total,0)),'Configured lecture duration')}${stat('COMPLETED',minutesLabel(state.courses.reduce((n,c)=>n+c.completed,0)),'Actual completed lecture time','green')}${stat('REMAINING',minutesLabel(state.courses.reduce((n,c)=>n+Math.max(0,c.total-c.completed),0)),'Lecture time left')}</div><div class="card"><div class="sectionhead"><h2>Your courses</h2><small>Initial estimates can be edited</small></div>${state.courses.map(c=>{let s=courseStats(c);return `<div class="course-row"><div><div class="course-name">${esc(c.name)}</div><div class="course-meta">${s.done}/${s.planned} topics complete</div></div><div class="course-progress"><div class="barlabel"><span>${minutesLabel(c.completed)} completed</span><span>${pct(c.completed,c.total)}%</span></div>${progress(c.completed,c.total)}<div class="course-meta">${minutesLabel(s.remaining)} remaining · ${minutesLabel(c.total)} total</div></div><div class="row"><button class="tinybtn" data-log-course="${c.id}">＋ Time</button><button class="tinybtn" data-edit-course="${c.id}">Edit</button></div></div>`}).join('')}</div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Topic history</h2><input id="courseSearch" placeholder="Search topics…" style="max-width:230px"></div><div id="courseHistory">${courseHistory()}</div></div>`}

utton data-timer-min="25">25 min</button><button data-timer-min="50">50 min</button><input id="customMinutes" type="number" min="1" max="240" value="30" style="width:90px"><button data-action="set-custom-timer">Custom</button></div><div class="clock" id="clock">${timerRemaining?clockFmt(timerRemaining):'25:00'}</div><div class="muted" id="timerState">Choose a duration, then start when ready.</div><div class="row" style="justify-content:center;margin-top:14px"><button class="primary" data-action="timer-start">Start</button><button data-action="timer-pause">Pause</button><button data-action="timer-stop">Stop & log</button></div></div></div>`}

const careerList=['Resume updated','GitHub reviewed','LinkedIn reviewed','Core programming practised','DSA practice','SQL practice','DBMS revision','Operating systems revision','Computer networks revision','Projects documented','Mock interviews completed','Applications submitted'];function renderCareer(){return `${pageHead('Projects & Career','Build evidence of your skills and keep placement decisions grounded.',`<button class="primary" data-action="add-project">＋ Add project</button>`)}<div class="grid twocol"><div class="card"><div class="sectionhead"><h2>Projects</h2><small>${state.projects.length} projects</small></div>${state.projects.length?state.projects.map(p=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(p.name)}</div><div class="meta">${esc(p.status||'Planning')} · ${esc(p.stack||'Stack not set')} ${p.next?'· Next: '+esc(p.next):''}</div>${p.repo?`<a href="${esc(p.repo)}" target="_blank" rel="noreferrer" style="color:var(--accent2);font-size:11px">Repository ↗</a>`:''}</div><button class="tinybtn" data-edit-project="${p.id}">Edit</button><button class="tinybtn danger" data-del-project="${p.id}">×</button></div>`).join(''):empty('No projects yet','Add a project and define the next concrete action.')}</div><div class="card"><div class="sectionhead"><h2>Career readiness</h2><small>${Object.values(state.careerChecks).filter(Boolean).length}/${careerList.length}</small></div>${careerList.map((x,i)=>`<div class="item"><input class="check" type="checkbox" data-career="${i}" ${state.careerChecks[i]?'checked':''}><div class="itembody"><div class="itemtitle">${x}</div></div></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Placement decision log</h2><button class="primary" data-action="add-decision">＋ Add decision</button></div><p class="sub">Record the service fee, eligibility, deadlines, recruiter access, opportunities, compensation/equity terms, risks, evidence, and your decision. This app function renderJournal(){return `${pageHead('Reflection Journal','Short notes are enough. Keep track of lessons, energy, and tomorrow’s first action.',`<button class="primary" data-action="add-journal">＋ New entry</button>`)}<div class="card"><div class="sectionhead"><h2>Journal entries</h2><input id="journalSearch" placeholder="Search entries…" style="max-width:240px"></div><div id="journalEntries">${journalEntries()}</div></div>`}function journalEntries(q=''){let entries=[...state.journal].sort((a,b)=>b.date.localeCompare(a.date));entries=entries.filter(e=>!q||[e.accomplishments,e.lessons,e.distractions,e.tomorrow].join(' ').toLowerCase().includes(q.toLowerCase()));return entries.length?entries.map(e=>`<div class="item"><div class="itembody"><div class="itemtitle">${fmtDate(e.date)} · ${esc(e.accomplishments||'Daily reflection')}</div><div class="meta">Energy ${e.energy||'—'}/5 · Focus ${e.focus||'—'}/5 · ${esc(e.tomorrow||'No first action set')}</div><div class="meta">${esc(e.lessons||'')}</div></div><button class="tinybtn" data-edit-journal="${e.id}">Edit</button><button class="tinybtn danger" data-del-journal="${e.id}">×</button></div>`).join(''):empty('No journal entries','Add a quick reflection after your day.')}
function renderSettings(){return `${pageHead('Settings & Data',cloudUser?'Cloud sync is active for your account; a local backup is also kept.':(cloudConfigured?'Sign in to sync this workspace across devices.':'Configure Supabase to enable cloud accounts and sync.'),`<button class="primary" data-action="backup">Export backup</button>`)}<div class="grid twocol"><div class="card"><h2>Cloud database &amp; account</h2><p class="sub" style="margin:6px 0 12px">${cloudConfigured? (cloudUser?`Signed in as ${esc(cloudUser.email||cloudUser.id)}. Changes sync to your private cloud workspace.`:`Supabase is configured. Sign in or create an account to enable sync.`):`Cloud is not configured yet. Add your Supabase project URL and publishable/anon key to config.js, then run the SQL setup file.`}</p><div class="row" style="flex-wrap:wrap"><button class="primary" data-action="cloud-auth">${cloudUser?'Manage account':'Sign in / Create account'}</button>${cloudUser?`<button data-action="cloud-upload-local">Replace cloud data with this browser's data</button><button data-action="cloud-logout">Sign out</button>`:''}</div><div class="footerhint">Each account gets a private workspace protected by Supabase Row Level Security. Never put a service-role key in this app.</div></div><div class="card"><h2>Appearance</h2><p class="sub" style="margin:6px 0 12px">Choose the interface theme for this browser.</p><select id="themeSelect"><option value="dark" ${state.settings.theme!=='light'?'selected':''}>Dark</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Light</option></select><button class="primary" style="margin-top:10px" data-action="save-theme">Save appearance</button></div><div class="card"><h2>Deadline & pace</h2><p class="sub" style="margin:6px 0 15px">Overall learning deadline used for the countdown.</p><label>Target deadline</label><input id="deadlineInput" type="date" value="${state.settings.deadline}"><div style="margin-top:15px" class="row between"><div><div class="statvalue" style="font-size:22px">${minutesLabel(state.courses.reduce((n,c)=>n+Math.max(0,c.total-c.completed),0))}</div><div class="meta">Lecture time remaining</div></div><div><div class="statvalue" style="font-size:22px">${(state.courses.reduce((n,c)=>n+Math.max(0,c.total-c.completed),0)/60/Math.max(1,Math.ceil((dateObj(state.settings.deadline)-dateObj(today()))/86400000))).toFixed(1)}h</div><div class="meta">Required average/day</div></div></div><div class="pace-note">Actual study pace: ${(state.sessions.length? (state.sessions.reduce((n,s)=>n+(+s.minutes||0),0)/Math.max(1,(dateObj(today())-dateObj(state.sessions.reduce((min,s)=>s.date<min?s.date:min,today())))/86400000)/60).toFixed(2):'0.00')} h/day recorded across the current session history. Required pace is based on remaining configured lecture time, not topic estimates.</div></div><div class="card"><h2>Minimum Viable Day</h2><p class="sub" style="margin:6px 0 15px">A reduced plan is not the same as completing your normal target.</p><label class="row" style="color:var(--text);gap:9px"><input id="minimumToggle" type="checkbox" style="width:auto" ${state.settings.minimumDay?'checked':''}> Enable reduced-day plan</label><div class="fieldgrid" style="margin-top:13px"><div><label>Coding minutes</label><input id="minimumCoding" type="number" min="0" value="${state.settings.minimumCoding}"></div><div><label>Revision minutes</label><input id="minimumRevision" type="number" min="0" value="${state.settings.minimumRevision}"></div></div><button class="primary" style="margin-top:12px" data-action="save-settings">Save settings</button></div></div><div class="card" style="margin-top:14px"><h2>Export & restore</h2><p class="sub" style="margin:6px 0 15px">Export CSV files for topics, tasks, and study sessions, or download a full JSON backup. Restoring replaces data currently saved in this browser.</p><div class="row" style="flex-wrap:wrap"><button data-action="export-topics">Topics CSV</button><button data-action="export-tasks">Tasks CSV</button><button data-action="export-sessions">Sessions CSV</button><button data-action="backup">Full JSON backup</button><button data-action="restore">Restore JSON backup</button><input id="restoreFile" type="file" accept="application/json,.json" class="hidden"></div><div class="footerhint">Local mode stores data in this browser. When signed in, SOS also syncs the workspace to Supabase. Keep backups; cloud sync requires correct project configuration and database policies.</div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Danger zone</h2><span class="tag overdue">Destructive</span></div><button class="danger" data-action="reset">Reset all SOS data</button></div>`}
function render(){ $('#topDate').textContent=fmtDate(today(),{weekday:'short',month:'short',day:'numeric'});let fn={home:renderHome,topics:renderTopics,tasks:renderTasks,courses:renderCourses,sessions:renderSessions,weekly:renderWeekly,monthly:renderMonthly,career:renderCareer,journal:renderJournal,settings:renderSettings}[page];$('#content').innerHTML=fn();bindDynamic()}
function openModal(title,body,submitText='Save',onSubmit=null){$('#modalRoot').innerHTML=`<div class="modalback" id="modalBack"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${title}</h2><button id="modalClose">✕</button></div><form id="modalForm">${body}<div class="actions"><button type="button" class="ghost" id="modalCancel">Cancel</button><button class="primary" type="submit">${submitText}</button></div></form></div></div>`;const close=()=>$('#modalRoot').innerHTML='';$('#modalClose').onclick=close;$('#modalCancel').onclick=close;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')close()};$('#modalForm').onsubmit=e=>{e.preventDefault();if(onSubmit?.(new FormData(e.target))!==false){close();save();render()}}}
function field(label,name,value='',type='text',extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value){return `<div><label>${label}</label><select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}function textArea(label,name,value='',rows=3){return `<div class="full"><label>${label}</label><textarea name="${name}" rows="${rows}">${esc(value)}</textarea></div>`}
function addTopicModal(t=null){let edit=!!t;openModal(edit?'Edit topic':'Add topic',`<div class="fieldgrid">${field('Topic name *','name',t?.name||'')}${selectField('Course *','courseId',state.courses.map(c=>[c.id,c.name]),t?.courseId||state.courses[0]?.id)}${field('Planned date *','date',t?.date||topicDate,'date')}${field('Estimated minutes','estimate',t?.estimate||'','number','min="0" max="1440"')}${selectField('Status','status',['Not Started','In Progress','Completed'].map(x=>[x,x]),t?.status||'Not Started')}</div>`,edit?'Save changes':'Add topic',fd=>{let name=fd.get('name').trim();if(!name){toast('Topic name is required');return false}let data={name,courseId:fd.get('courseId'),date:fd.get('date'),estimate:Math.max(0,+fd.get('estimate')||0),status:fd.get('status')};if(!data.date||!course(data.courseId)){toast('Choose a valid date and course');return false}if(edit)Object.assign(t,data,{updatedAt:new Date().toISOString()});else state.topics.push({id:id(),...data,sortOrder:state.topics.filter(x=>x.date===data.date&&x.courseId===data.courseId).length,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});topicDate=data.date;toast(edit?'Topic updated':'Topic added')})}
function bulkTopicModal(){openModal('Bulk add topics',`<div class="fieldgrid">${selectField('Course *','courseId',state.courses.map(c=>[c.id,c.name]),state.courses[0]?.id)}${field('Planned date *','date',topicDate,'date')}<div class="full"><label>Topic names · one per line *</label><textarea name="names" rows="9" placeholder="Variables and data types&#10;Conditional statements&#10;Loops&#10;Functions" required></textarea></div>${field('Estimated minutes per topic (optional)','estimate','','number','min="0" max="1440"')}</div>`, 'Create topics',fd=>{let names=fd.get('names').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!names.length||!fd.get('date')||!course(fd.get('courseId'))){toast('Add topic names, course, and date');return false}let est=Math.max(0,+fd.get('estimate')||0),now=new Date().toISOString();let order=state.topics.filter(t=>t.date===fd.get('date')&&t.courseId===fd.get('courseId')).length;names.forEach((name,i)=>state.topics.push({id:id(),name,courseId:fd.get('courseId'),date:fd.get('date'),estimate:est,status:'Not Started',sortOrder:order+i,createdAt:now,updatedAt:now}));topicDate=fd.get('date');toast(`${names.length} topics added`)})}
function addTaskModal(t=null){let edit=!!t;openModal(edit?'Edit task':'Add task',`<div class="fieldgrid">${field('Title *','title',t?.title||'')}${field('Scheduled date *','date',t?.date||today(),'date')}${selectField('Category','category',['Learning','Coding Practice','Revision','Projects','Career','Health','Personal'].map(x=>[x,x]),t?.category||'Learning')}${selectField('Priority','priority',['Low','Medium','High'].map(x=>[x,x]),t?.priority||'Medium')}${selectField('Status','status',['Pending','In Progress','Completed','Cancelled'].map(x=>[x,x]),t?.status||'Pending')}${field('Estimated minutes','estimate',t?.estimate||'','number','min="0"')}${textArea('Description / notes','notes',t?.notes||'',2)}</div>`,edit?'Save changes':'Create task',fd=>{let title=fd.get('title').trim();if(!title){toast('Task title is required');return false}let d={title,date:fd.get('date'),category:fd.get('category'),priority:fd.get('priority'),status:fd.get('status'),estimate:Math.max(0,+fd.get('estimate')||0),notes:fd.get('notes')};if(edit)Object.assign(t,d,{updatedAt:new Date().toISOString()});else state.tasks.push({id:id(),...d,createdAt:new Date().toISOString()});taskDate=d.date;toast(edit?'Task updated':'Task added')})}
function addCourseModal(c=null){let edit=!!c;openModal(edit?'Edit course':'Add course',`<div class="fieldgrid">${field('Course name *','name',c?.name||'')}${field('Total lecture minutes *','total',c?.total??'','number','min="1"')}${field('Completed lecture minutes','completed',c?.completed||0,'number','min="0"')}${field('Planned completion date','deadline',c?.deadline||state.settings.deadline,'date')}</div><p class="footerhint">Completed lecture time is independent of topic completion. If completed time exceeds the total, you will be asked to confirm.</p>`,edit?'Save course':'Create course',fd=>{let name=fd.get('name').trim(),total=+fd.get('total'),completed=+fd.get('completed')||0;if(!name||!Number.isFinite(total)||total<=0){toast('Enter a name and valid total duration');return false}if(completed>total&&!confirm('Completed time exceeds total duration. Save anyway?'))return false;let d={name,total:Math.round(total),completed:Math.max(0,Math.round(completed)),deadline:fd.get('deadline')||state.settings.deadline};if(edit)Object.assign(c,d);else state.courses.push({id:id(),...d});toast(edit?'Course updated':'Course added')})}
function addSessionModal(s=null,preCourse=null){let edit=!!s;openModal(edit?'Edit study session':'Log study session',`<div class="fieldgrid">${selectField('Course *','courseId',state.courses.map(c=>[c.id,c.name]),s?.courseId||preCourse||state.courses[0]?.id)}${field('Date *','date',s?.date||today(),'date')}${field('Actual duration (minutes) *','minutes',s?.minutes||25,'number','min="1" max="1440"')}<div><label>Linked topic (optional)</label><select name="topicId"><option value="">No linked topic</option>${state.topics.filter(t=>t.courseId===(s?.courseId||preCourse||state.courses[0]?.id)).map(t=>`<option value="${t.id}" ${s?.topicId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label>Linked task (optional)</label><select name="taskId"><option value="">No linked task</option>${state.tasks.map(t=>`<option value="${t.id}" ${s?.taskId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div>${textArea('Notes / topic studied','notes',s?.notes||'',2)}<div><label class="row" style="gap:8px;color:var(--text)"><input type="checkbox" name="practical" style="width:auto" ${s?.practical?'checked':''}> Practical exercises completed</label></div></div>`,edit?'Save session':'Save session',fd=>{let mins=+fd.get('minutes');if(!course(fd.get('courseId'))||!fd.get('date')||!Number.isFinite(mins)||mins<1){toast('Enter valid session details');return false}let d={courseId:fd.get('courseId'),date:fd.get('date'),minutes:Math.round(mins),topicId:fd.get('topicId')||'',taskId:fd.get('taskId')||'',notes:fd.get('notes'),practical:fd.get('practical')==='on'};if(edit)Object.assign(s,d);else state.sessions.push({id:id(),...d,createdAt:new Date().toISOString()});toast(edit?'Session updated':'Actual study time logged')})}
function addMilestoneModal(m=null){let edit=!!m;openModal(edit?'Edit milestone':'Add milestone',`<div class="fieldgrid">${field('Title *','title',m?.title||'')}${field('Month','month',m?.month||month,'month')}${textArea('Description / deliverable','description',m?.description||'',3)}</div>`,edit?'Save milestone':'Add milestone',fd=>{if(!fd.get('title').trim()){toast('Title is required');return false}if(edit)Object.assign(m,{title:fd.get('title').trim(),month:fd.get('month'),description:fd.get('description')});else state.milestones.push({id:id(),title:fd.get('title').trim(),month:fd.get('month'),description:fd.get('description'),done:false});month=fd.get('month');toast('Milestone saved')})}
function addProjectModal(p=null){let edit=!!p;openModal(edit?'Edit project':'Add project',`<div class="fieldgrid">${field('Project name *','name',p?.name||'')}${selectField('Status','status',['Planning','In Progress','Paused','Completed'].map(x=>[x,x]),p?.status||'Planning')}${field('Tech stack','stack',p?.stack||'')}${field('Deadline','deadline',p?.deadline||'','date')}${field('Repository URL','repo',p?.repo||'','url')}${field('Deployment URL','url',p?.url||'','url')}${textArea('Description','description',p?.description||'',2)}${textArea('Next action','next',p?.next||'',2)}</div>`,edit?'Save project':'Add project',fd=>{if(!fd.get('name').trim()){toast('Project name is required');return false}let d={name:fd.get('name').trim(),status:fd.get('status'),stack:fd.get('stack'),deadline:fd.get('deadline'),repo:fd.get('repo'),url:fd.get('url'),description:fd.get('description'),next:fd.get('next')};if(edit)Object.assign(p,d);else state.projects.push({id:id(),...d});toast('Project saved')})}
function addJournalModal(e=null){let edit=!!e;openModal(edit?'Edit journal entry':'New journal entry',`<div class="fieldgrid">${field('Date','date',e?.date||today(),'date')}${selectField('Energy (1–5)','energy',['1','2','3','4','5'].map(x=>[x,x]),String(e?.energy||3))}${selectField('Focus (1–5)','focus',['1','2','3','4','5'].map(x=>[x,x]),String(e?.focus||3))}${textArea('Accomplishments','accomplishments',e?.accomplishments||'',2)}${textArea('Lessons learned','lessons',e?.lessons||'',2)}${textArea('Distractions','distractions',e?.distractions||'',2)}${textArea("Tomorrow's first action",'tomorrow',e?.tomorrow||'',2)}</div>`,edit?'Save entry':'Save entry',fd=>{let d={date:fd.get('date'),energy:+fd.get('energy'),focus:+fd.get('focus'),accomplishments:fd.get('accomplishments'),lessons:fd.get('lessons'),distractions:fd.get('distractions'),tomorrow:fd.get('tomorrow')};if(edit)Object.assign(e,d);else state.journal.push({id:id(),...d});toast('Journal entry saved')})}
function addDecisionModal(d=null){let edit=!!d;openModal(edit?'Edit placement decision':'Placement decision log',`<div class="fieldgrid">${field('Service / opportunity *','name',d?.name||'')}${field('Fee','fee',d?.fee||'')}${field('Registration deadline','review',d?.review||'','date')}${selectField('Decision','decision',['Not decided','Proceed','Decline','Investigate further'].map(x=>[x,x]),d?.decision||'Not decided')}${textArea('Eligibility / recruiter access / terms','terms',d?.terms||'',3)}${textArea('Risks and trade-offs','risks',d?.risks||'',2)}${textArea('Evidence collected','evidence',d?.evidence||'',3)}</div>`,edit?'Save decision':'Save decision',fd=>{if(!fd.get('name').trim()){toast('Name is required');return false}state.decisions=state.decisions||[];let obj={name:fd.get('name'),fee:fd.get('fee'),review:fd.get('review'),decision:fd.get('decision'),terms:fd.get('terms'),risks:fd.get('risks'),evidence:fd.get('evidence')};if(edit)Object.assign(d,obj);else state.decisions.push({id:id(),...obj});toast('Decision saved')})}
function exportCSV(filename,rows){if(!rows.length){toast('No records to export');return}let keys=[...new Set(rows.flatMap(r=>Object.keys(r)))],csv=[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\r\n');download(filename,csv,'text/csv;charset=utf-8');toast('CSV exported')}
function download(filename,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(`sos-backup-${today()}.json`,JSON.stringify(state,null,2),'application/json');toast('Backup downloaded')}
function bindDynamic(){$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-topic-check]').forEach(x=>x.onchange=()=>{let t=state.topics.find(t=>t.id===x.dataset.topicCheck);if(t){t.status=x.checked?'Completed':'Not Started';t.updatedAt=new Date().toISOString();save();render()}});$$('[data-task-check]').forEach(x=>x.onchange=()=>{let t=state.tasks.find(t=>t.id===x.dataset.taskCheck);if(t){t.status=x.checked?'Completed':'Pending';save();render()}});$$('[data-edit-topic]').forEach(b=>b.onclick=()=>addTopicModal(state.topics.find(t=>t.id===b.dataset.editTopic)));$$('[data-move-topic]').forEach(b=>b.onclick=()=>{let t=state.topics.find(x=>x.id===b.dataset.moveTopic);if(!t)return;let siblings=state.topics.filter(x=>x.date===t.date&&x.courseId===t.courseId).sort((a,c)=>(a.sortOrder??0)-(c.sortOrder??0));let i=siblings.findIndex(x=>x.id===t.id),j=i+(b.dataset.dir==='up'?-1:1);if(j<0||j>=siblings.length)return;let a=siblings[i],z=siblings[j],av=a.sortOrder??i,zv=z.sortOrder??j;a.sortOrder=zv;z.sortOrder=av;save();render()});$$('[data-del-topic]').forEach(b=>b.onclick=()=>{if(confirm('Delete this topic? Existing study sessions are kept.')){state.topics=state.topics.filter(t=>t.id!==b.dataset.delTopic);save();render();toast('Topic deleted')}});$$('[data-edit-task]').forEach(b=>b.onclick=()=>addTaskModal(state.tasks.find(t=>t.id===b.dataset.editTask)));$$('[data-duplicate-task]').forEach(b=>b.onclick=()=>{let t=state.tasks.find(x=>x.id===b.dataset.duplicateTask);if(t){state.tasks.push({...t,id:id(),title:t.title+' (copy)',status:'Pending',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});save();render();toast('Task duplicated')}});$$('[data-del-task]').forEach(b=>b.onclick=()=>{if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.delTask);save();render()}});$$('[data-edit-course]').forEach(b=>b.onclick=()=>addCourseModal(course(b.dataset.editCourse)));$$('[data-log-course]').forEach(b=>b.onclick=()=>addSessionModal(null,b.dataset.logCourse));$$('[data-edit-session]').forEach(b=>b.onclick=()=>addSessionModal(state.sessions.find(s=>s.id===b.dataset.editSession)));$$('[data-del-session]').forEach(b=>b.onclick=()=>{if(confirm('Delete this session? Actual study totals will recalculate.')){state.sessions=state.sessions.filter(s=>s.id!==b.dataset.delSession);save();render()}});$$('[data-milestone-check]').forEach(x=>x.onchange=()=>{let m=state.milestones.find(m=>m.id===x.dataset.milestoneCheck);if(m)m.done=x.checked;save();render()});$$('[data-edit-milestone]').forEach(b=>b.onclick=()=>addMilestoneModal(state.milestones.find(m=>m.id===b.dataset.editMilestone)));$$('[data-del-milestone]').forEach(b=>b.onclick=()=>{if(confirm('Delete milestone?')){state.milestones=state.milestones.filter(m=>m.id!==b.dataset.delMilestone);save();render()}});$$('[data-career]').forEach(x=>x.onchange=()=>{state.careerChecks[x.dataset.career]=x.checked;save()});$$('[data-edit-project]').forEach(b=>b.onclick=()=>addProjectModal(state.projects.find(p=>p.id===b.dataset.editProject)));$$('[data-del-project]').forEach(b=>b.onclick=()=>{if(confirm('Delete project?')){state.projects=state.projects.filter(p=>p.id!==b.dataset.delProject);save();render()}});$$('[data-edit-journal]').forEach(b=>b.onclick=()=>addJournalModal(state.journal.find(e=>e.id===b.dataset.editJournal)));$$('[data-del-journal]').forEach(b=>b.onclick=()=>{if(confirm('Delete journal entry?')){state.journal=state.journal.filter(e=>e.id!==b.dataset.delJournal);save();render()}});$$('[data-edit-decision]').forEach(b=>b.onclick=()=>addDecisionModal(state.decisions?.find(d=>d.id===b.dataset.editDecision)));$$('[data-del-decision]').forEach(b=>b.onclick=()=>{if(confirm('Delete this decision?')){state.decisions=state.decisions.filter(d=>d.id!==b.dataset.delDecision);save();render()}});
$('#topicDate')?.addEventListener('change',e=>{topicDate=e.target.value||today();render()});$('#topicCourse')?.addEventListener('change',e=>{topicCourse=e.target.value;render()});$('#topicFilter')?.addEventListener('change',e=>{topicFilter=e.target.value;render()});$('#taskDate')?.addEventListener('change',e=>{taskDate=e.target.value||'all';render()});$('#taskFilter')?.addEventListener('change',e=>{taskFilter=e.target.value;render()});$('#courseSearch')?.addEventListener('input',e=>$('#courseHistory').innerHTML=courseHistory(e.target.value));$('#journalSearch')?.addEventListener('input',e=>$('#journalEntries').innerHTML=journalEntries(e.target.value));$('#weekDate')?.addEventListener('change',e=>{weekDate=e.target.value||today();render()});$('#monthInput')?.addEventListener('change',e=>{month=e.target.value||today().slice(0,7);render()});$('#deadlineInput')?.addEventListener('change',e=>{state.settings.deadline=e.target.value||'2026-12-31';save();render()});$$('[data-review]').forEach(x=>x.addEventListener('change',()=>{let key=monday(weekDate);state.reviews[key]=state.reviews[key]||{};state.reviews[key][x.dataset.review]=x.value;save()}));$$('[data-timer-min]').forEach(b=>b.onclick=()=>{timerRemaining=+b.dataset.timerMin*60;timerInitial=timerRemaining;timerRunning=false;timerEverStarted=false;clearInterval(timerInterval);saveTimer();$('#clock').textContent=clockFmt(timerRemaining);$('#timerState').textContent='Timer ready';});
$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('#restoreFile')?.addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data.courses||!data.topics||!data.sessions)throw new Error('Invalid backup');if(confirm('Restore this backup? Current data will be replaced.')){state=data;save();render();toast('Backup restored')}}catch(err){toast('Could not restore: invalid JSON backup')}e.target.value=''});}
function openCloudAuth(){if(!cloudConfigured||!supabaseClient){toast('Supabase is not configured yet. Follow the README setup steps.');go('settings');return}$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><div><h2>${cloudUser?'Cloud account':'Connect SOS to the cloud'}</h2><div class="meta">Supabase Authentication</div></div><button id="closeCloudAuth">✕</button></div>${cloudUser?`<p class="sub">Signed in as <strong>${esc(cloudUser.email||cloudUser.id)}</strong>.</p><div class="actions"><button data-action="cloud-logout">Sign out</button></div>`:`<form id="cloudAuthForm"><div class="fieldgrid"><div class="full"><label>Email</label><input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></div><div class="full"><label>Password (at least 6 characters)</label><input type="password" name="password" autocomplete="current-password" minlength="6" required placeholder="Choose a strong password"></div></div><p class="footerhint">Use Sign up for a new account or Sign in if you already registered. Supabase may require email confirmation depending on your project settings.</p><div class="actions"><button type="button" id="cloudCancel">Cancel</button><button type="button" class="primary" id="cloudSignIn">Sign in</button><button type="submit" class="primary">Sign up</button></div></form>`}</div></div>`;$('#closeCloudAuth').onclick=()=>$('#modalRoot').innerHTML='';$('#modalRoot').querySelector('[data-action="cloud-logout"]')?.addEventListener('click',signOutCloud);$('#cloudCancel')?.addEventListener('click',()=>$('#modalRoot').innerHTML='');$('#cloudSignIn')?.addEventListener('click',async()=>{const f=$('#cloudAuthForm');if(!f.reportValidity())return;const email=f.elements.email.value.trim(),password=f.elements.password.value;const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){toast(error.message);return}$('#modalRoot').innerHTML='';await handleAuthSession();});$('#cloudAuthForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;const {data,error}=await supabaseClient.auth.signUp({email:f.elements.email.value.trim(),password:f.elements.password.value});if(error){toast(error.message);return}if(data.session){$('#modalRoot').innerHTML='';await handleAuthSession()}else{toast('Account created. Check your email to confirm, then sign in.');$('#modalRoot').innerHTML=''}})}
async function handleAuthSession(){if(!supabaseClient)return;cloudBusy=true;try{const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;cloudUser=session?.user||null;if(cloudUser){const {data,error}=await supabaseClient.from('sos_workspaces').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;if(data?.data){try{localStorage.setItem('sos-state-v1',JSON.stringify(state));}catch(e){}const useCloud=confirm("A cloud workspace already exists. Click OK to load it on this device. Click Cancel to upload this browser's current SOS data and replace that cloud workspace. Export a backup first if unsure.");if(useCloud){state={...defaultState(),...data.data,settings:{...defaultState().settings,...(data.data.settings||{})},decisions:data.data.decisions||[],reviews:data.data.reviews||{},careerChecks:data.data.careerChecks||{}};localStorage.setItem('sos-state-v1',JSON.stringify(state));}else{const {error:upErr}=await supabaseClient.from('sos_workspaces').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(upErr)throw upErr;}}else{const {error:upErr}=await supabaseClient.from('sos_workspaces').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(upErr)throw upErr;}toast('Cloud account connected. Workspace sync is enabled.');}updateCloudUI();render();}catch(err){console.error(err);toast('Could not load cloud workspace: '+(err.message||'Unknown error'));}finally{cloudBusy=false;}}
async function signOutCloud(){if(!supabaseClient)return;const {error}=await supabaseClient.auth.signOut();if(error){toast(error.message);return}cloudUser=null;clearTimeout(cloudSaveTimer);updateCloudUI();$('#modalRoot').innerHTML='';render();toast('Signed out. Your local browser copy remains available.')}
async function uploadLocalToCloud(){if(!cloudUser||!supabaseClient){toast('Sign in first');return}if(!confirm('Replace your cloud workspace with all data currently in this browser? This cannot be undone unless you have a backup.'))return;try{const {error}=await supabaseClient.from('sos_workspaces').upsert({user_id:cloudUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;toast("This browser's data was uploaded to your cloud workspace.");const el=$('#storageStatus');if(el)el.textContent='Cloud synced just now';}catch(err){toast('Upload failed: '+err.message)}}
function action(a){switch(a){case'cloud-auth':openCloudAuth();break;case'cloud-logout':signOutCloud();break;case'cloud-upload-local':uploadLocalToCloud();break;case'add-topic':addTopicModal();break;case'bulk-topic':bulkTopicModal();break;case'add-task':addTaskModal();break;case'add-course':addCourseModal();break;case'add-session':addSessionModal();break;case'add-milestone':addMilestoneModal();break;case'add-project':addProjectModal();break;case'add-journal':addJournalModal();break;case'add-decision':addDecisionModal();break;case'focus':go('sessions');break;case'all-tasks':taskDate='all';render();break;case'carry':{let candidates=state.tasks.filter(t=>t.date<today()&&t.status!=='Completed'&&t.status!=='Cancelled');if(!candidates.length){toast('No unfinished overdue tasks');break}let date=prompt(`Move ${candidates.length} unfinished task(s) to which date? (YYYY-MM-DD)`,today());if(date&&/^\d{4}-\d{2}-\d{2}$/.test(date)&&confirm(`Move ${candidates.length} existing tasks to ${date}?`)){candidates.forEach(t=>t.date=date);taskDate=date;save();render();toast('Tasks rescheduled; no duplicates created')}break}case'overdue':topicFilter=topicFilter==='Overdue'?'All':'Overdue';go('topics');break;case'export-topics':exportCSV('sos-topics.csv',state.topics.map(t=>({...t,course:courseName(t.courseId)})));break;case'export-tasks':exportCSV('sos-tasks.csv',state.tasks);break;case'export-sessions':exportCSV('sos-study-sessions.csv',state.sessions.map(s=>({...s,course:courseName(s.courseId)})));break;case'backup':backup();break;case'restore':$('#restoreFile')?.click();break;case'reset':if(confirm('Delete all SOS data saved in this browser? This cannot be undone.')){state=defaultState();save();go('home');toast('SOS data reset')}break;case'save-theme':state.settings.theme=$('#themeSelect')?.value==='light'?'light':'dark';document.body.classList.toggle('light',state.settings.theme==='light');save();render();toast('Appearance saved');break;case'save-settings':state.settings.minimumDay=$('#minimumToggle').checked;state.settings.minimumCoding=Math.max(0,+$('#minimumCoding').value||0);state.settings.minimumRevision=Math.max(0,+$('#minimumRevision').value||0);save();render();toast('Settings saved');break;case'save-review':$$('[data-review]').forEach(x=>{let key=monday(weekDate);state.reviews[key]=state.reviews[key]||{};state.reviews[key][x.dataset.review]=x.value});save();toast('Weekly review saved');break;case'timer-start':if(!timerRemaining){timerRemaining=25*60;timerInitial=timerRemaining;timerEverStarted=false}if(!timerRunning){timerEverStarted=true;timerRunning=true;timerEnd=Date.now()+timerRemaining*1000;saveTimer();clearInterval(timerInterval);timerInterval=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));saveTimer();if($('#clock'))$('#clock').textContent=clockFmt(timerRemaining);if(timerRemaining<=0){timerRunning=false;clearInterval(timerInterval);saveTimer();if($('#timerState'))$('#timerState').textContent='Timer finished. Save a session if you studied.';toast('Focus timer finished')}} ,250);if($('#timerState'))$('#timerState').textContent='Focus session in progress';}break;case'timer-pause':if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerInterval);saveTimer();if($('#timerState'))$('#timerState').textContent='Paused';if($('#clock'))$('#clock').textContent=clockFmt(timerRemaining)}break;case'timer-stop':{if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerInterval);saveTimer()}let elapsed=Math.floor((timerInitial-timerRemaining)/60);if(timerEverStarted&&elapsed>0){if(confirm(`Log approximately ${elapsed} minutes as actual study time?`)){addSessionModal(null,$('#timerCourse')?.value||state.courses[0]?.id);setTimeout(()=>{let mi=$('#modalForm input[name="minutes"]');if(mi)mi.value=elapsed},0)}}timerRemaining=0;timerEverStarted=false;saveTimer();if($('#clock'))$('#clock').textContent='00:00';if($('#timerState'))$('#timerState').textContent='Timer stopped';break}case'set-custom-timer':{let n=Math.max(1,Math.min(240,+$('#customMinutes').value||25));timerRemaining=n*60;timerInitial=timerRemaining;timerRunning=false;timerEverStarted=false;clearInterval(timerInterval);saveTimer();$('#clock').textContent=clockFmt(timerRemaining);$('#timerState').textContent=`Custom ${n}-minute timer ready`;break}default:break}}
let timerInitial=1500,timerEverStarted=false;try{const savedTimer=JSON.parse(localStorage.getItem('sos-timer-v1')||'null');if(savedTimer){timerRemaining=Math.max(0,Math.ceil(savedTimer.remaining||0));timerInitial=Math.max(60,Math.ceil(savedTimer.initial||1500));timerEverStarted=!!savedTimer.started;if(savedTimer.running&&savedTimer.end){timerEnd=savedTimer.end;timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=timerRemaining>0;}}}catch(e){}function saveTimer(){try{localStorage.setItem('sos-timer-v1',JSON.stringify({remaining:timerRunning?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerRemaining,initial:timerInitial,end:timerEnd,running:timerRunning,started:timerEverStarted}))}catch(e){}}
document.body.classList.toggle('light',state.settings.theme==='light');$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#quickTopic').onclick=()=>addTopicModal();updateCloudUI();render();if(supabaseClient){supabaseClient.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){cloudUser=null;clearTimeout(cloudSaveTimer);updateCloudUI();}});handleAuthSession()}if(timerRunning){timerInterval=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));saveTimer();if($('#clock'))$('#clock').textContent=clockFmt(timerRemaining);if(timerRemaining<=0){timerRunning=false;clearInterval(timerInterval);saveTimer();if($('#timerState'))$('#timerState').textContent='Timer finished. Save a session if you studied.';toast('Focus timer finished')}},250)}
})();
